<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
<header>
    <div class="container flex">
        <div class="logo"></div>

        <div class="nav">
            <p>Home</p>
            <p>About Us</p>
            <p>Contacts</p>
            <p>News</p>
            <p>Services</p>
        </div>
    </div>
</header>

<section class="container box">
    <button class="block auto">
        <p class="title">AUTO</p>
    </button>

    <button class="block defolt">
        <p class="title">DEFAULT</p>
    </button>

    <button class="block none">
        <p class="title">NONE</p>
    </button>

    <button class="block point">
        <p class="title">POINTER</p>
    </button>

    <button class="block text">
        <p class="title">TEXT</p>
    </button>

    <button class="block content">
        <p class="title">CONTEXT-MENU</p>
    </button>

    <button class="block help">
        <p class="title">HELP</p>
    </button>

    <button class="block prog">
        <p class="title">PROGRESS</p>
    </button>

    <button class="block wait">
        <p class="title">WAIT</p>
    </button>

    <button class="block cell">
        <p class="title">CELL</p>
    </button>

    <button class="block cross">
        <p class="title">CROSSHAIR</p>
    </button>

    <button class="block vertical">

    </button>

    <button class="block alias">
        <p class="title">ALIAS</p>
    </button>

    <button class="block copy">
        <p class="title">COPY</p>
    </button>

    <button class="block move">
        <p class="title">MOVE</p>
    </button>

    <button class="block drop">
        <p class="title">NO-DROP</p>
    </button>

    <button class="block allowe">
        <p class="title">NOT-ALLOWE</p>
    </button>

    <button class="block grab">
        <p class="title">GRAB</p>
    </button>

    <button class="block grabbing">
        <p class="title">GRABBING</p>
    </button>

    <button class="block scroll">
        <p class="title">ALL-SCROLL</p>
    </button>

    <button class="block reseze">
        <p class="title">COL-RESIZE</p>
    </button>

    <button class="block row">
        <p class="title">ROW-RESIZE</p>
    </button>

    <button class="block in">
        <p class="title">ZOOM-IN</p>
    </button>

    <button class="block out">
        <p class="title">ZOOM-OUT</p>
    </button>

</body>
</html>
